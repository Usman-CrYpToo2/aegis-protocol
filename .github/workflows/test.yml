name: test

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  SOLANA_VERSION: 3.1.14
  ANCHOR_VERSION: 1.0.2
  NODE_VERSION: 24

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the compiler; this installs it before anything is cached.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache Solana toolchain
        id: solana-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI
        if: steps.solana-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"

      # Anchor publishes a prebuilt Linux binary, which is much faster than compiling it.
      - name: Install Anchor CLI
        run: |
          mkdir -p ~/.local/bin
          curl -sSfL -o ~/.local/bin/anchor \
            "https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          chmod +x ~/.local/bin/anchor

      - name: Add tools to PATH
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          rustc --version
          solana --version
          anchor --version

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      # The TypeScript tests load target/deploy/*.so and target/idl/*.json, so build first.
      # Program keypairs are private keys and are never committed, so CI would generate fresh
      # ones that do not match declare_id!. The tests load each program at its declared ID and
      # never need the keypair, so the check is skipped.
      - name: Build programs
        run: anchor build --ignore-keys

      - name: Rust unit tests
        run: cargo test -p aegis --lib

      - name: TypeScript tests (LiteSVM)
        run: yarn test
