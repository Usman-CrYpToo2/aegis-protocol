[package]
name = "aegis-hook"
version = "0.1.0"
description = "Permissive Token-2022 transfer hook for Aegis cRWA"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "aegis_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
spl-transfer-hook-interface = "2.1.0"
spl-tlv-account-resolution = "0.11.4"
spl-discriminator = "0.5.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
